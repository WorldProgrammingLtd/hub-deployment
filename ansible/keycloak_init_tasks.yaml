- name: Create temporary file for admin password
  ansible.builtin.tempfile:
    state: file
    suffix: hubadminpw
  register: admin_password_tempfile
  no_log: true

- name: Write admin password to temporary file
  ansible.builtin.copy:
    content: "{{ admin.password }}"
    dest: "{{ admin_password_tempfile.path }}"
    mode: 0600
  no_log: true

- name: Create Hub admin user via hubctl
  ansible.builtin.command:
    argv:
      - /usr/local/bin/hubctl
      - admin
      - create
      - --username
      - "{{ admin.username }}"
      - --passwordfile
      - "{{ admin_password_tempfile.path }}"
      - --nomfa
  register: hubctl_admin_create
  failed_when:
    - hubctl_admin_create.rc != 0
    - "'already exists' not in hubctl_admin_create.stderr"
  changed_when: hubctl_admin_create.rc == 0
  no_log: true

- name: Warn if Hub admin user already exists
  ansible.builtin.debug:
    msg: >
      Hub admin user {{ admin.username }} already exists in Keycloak; skipping creation.
      Its password was not modified - update it manually if admin.password has changed.
  when: hubctl_admin_create.rc != 0

- name: Remove temporary admin password file
  ansible.builtin.file:
    path: "{{ admin_password_tempfile.path }}"
    state: absent
